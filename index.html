
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isabella y Juan ✨</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020204;
}

body {
  display: grid;
  place-items: center;
}

#escena {
  position: relative;
  height: min(100dvh, 177.78vw);
  width: min(100vw, 56.25dvh);
  background: #020204;
  overflow: hidden;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#arte { z-index: 1; }
#magia { z-index: 2; pointer-events: none; }
</style>
</head>
<body>
<div id="escena">
  <canvas id="arte"></canvas>
  <canvas id="magia"></canvas>
</div>

<script>
const img = new Image();
img.src = "ramo.png";

const W = 540, H = 960;
const arte = document.querySelector("#arte");
const magia = document.querySelector("#magia");
const ctx = arte.getContext("2d");
const fx = magia.getContext("2d");

arte.width = magia.width = W;
arte.height = magia.height = H;

const original = document.createElement("canvas");
const octx = original.getContext("2d", {
  willReadFrequently: true
});

const SW = 270, SH = 480;
original.width = SW;
original.height = SH;

let pixeles = [];
let puntosDorado = [];
let cargado = false;
let inicio = 0;

const letras = "@#%*+=-:. ";

img.onload = () => {
  // Ajustar la imagen completa al lienzo, sin deformarla.
  octx.fillStyle = "#020204";
  octx.fillRect(0, 0, SW, SH);

  const escala = Math.min(
    SW / img.width,
    SH / img.height
  );

  const iw = img.width * escala;
  const ih = img.height * escala;
  const ox = (SW - iw) / 2;
  const oy = (SH - ih) / 2;

  octx.drawImage(img, ox, oy, iw, ih);

  const datos = octx.getImageData(0, 0, SW, SH).data;

  pixeles = [];
  puntosDorado = [];

  for (let y = 0; y < SH; y += 2) {
    for (let x = 0; x < SW; x += 2) {
      const i = (y * SW + x) * 4;
      const r = datos[i];
      const g = datos[i + 1];
      const b = datos[i + 2];

      const brillo = 0.2126*r + 0.7152*g + 0.0722*b;
      if (brillo < 9) continue;

      // Mantener los colores originales del ramo.
      const nivel = Math.min(
        letras.length - 1,
        Math.floor(brillo / 256 * letras.length)
      );

      pixeles.push({
        x, y, r, g, b, brillo,
        letra: letras[nivel],
        orden: y + Math.random() * 55
      });

      // Extraer solamente los tonos dorados de la imagen.
      const dorado =
        r > 145 &&
        g > 75 &&
        b < 175 &&
        r > g * 1.12 &&
        g > b * 1.12;

      // Limitar a zonas exteriores para evitar mover el ramo.
      const dx = x - SW * 0.5;
      const dy = y - SH * 0.49;
      const distancia = Math.sqrt(dx*dx + dy*dy);

      if (dorado && distancia > 66) {
        puntosDorado.push({
          x, y,
          r, g, b,
          brillo,
          fase: Math.random() * Math.PI * 2
        });
      }
    }
  }

  pixeles.sort((a,b) => a.orden - b.orden);
  inicio = performance.now();
  cargado = true;
};

function dibujarASCII(t) {
  ctx.fillStyle = "#020204";
  ctx.fillRect(0, 0, W, H);

  if (!cargado) {
    ctx.fillStyle = "#d9bd81";
    ctx.font = "16px monospace";
    ctx.fillText("Cargando jardín mágico...", 100, H/2);
    return;
  }

  const segundos = (t - inicio) / 1000;
  const progreso = Math.min(1, Math.max(0, (segundos - .4) / 8));
  const limite = Math.floor(pixeles.length * progreso);

  ctx.font = "6px monospace";
  ctx.textBaseline = "top";

  for (let i = 0; i < limite; i++) {
    const p = pixeles[i];

    // La escala se conserva para que el ramo ocupe el encuadre.
    const x = p.x * 2;
    const y = p.y * 2;

    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.globalAlpha = 1;

    if (p.brillo > 175) {
      ctx.shadowBlur = 2;
      ctx.shadowColor = ctx.fillStyle;
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.fillText(p.letra, x, y);
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Al terminar, conservar el ramo visible y nítido.
  if (progreso >= 1) {
    ctx.globalAlpha = 0.16;
    ctx.drawImage(original, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

function dibujarEstrellas(t) {
  fx.clearRect(0, 0, W, H);

  if (!cargado) return;

  const segundos = (t - inicio) / 1000;
  const aparicion = Math.max(0, Math.min(1, (segundos - 4) / 3));

  // Movimiento circular de los detalles dorados de la imagen.
  const cx = W * 0.5;
  const cy = H * 0.49;
  const giro = segundos * 0.32;

  fx.save();
  fx.globalCompositeOperation = "lighter";

  for (const p of puntosDorado) {
    const px = p.x * 2;
    const py = p.y * 2;

    const dx = px - cx;
    const dy = py - cy;

    const a = Math.atan2(dy, dx) + giro;
    const radio = Math.sqrt(dx*dx + dy*dy);

    const x = cx + Math.cos(a) * radio;
    const y = cy + Math.sin(a) * radio;

    // Destellos sutiles; no se añaden estrellas nuevas.
    const pulso = 0.68 + 0.32 *
      Math.sin(t * 0.003 + p.fase);

    fx.globalAlpha = aparicion * pulso * 0.85;
    fx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    fx.fillRect(x, y, 2, 2);
  }

  fx.restore();
  fx.globalAlpha = 1;
}

function animar(t) {
  dibujarASCII(t);
  dibujarEstrellas(t);
  requestAnimationFrame(animar);
}

requestAnimationFrame(animar);
</script>
</body>
</html>
